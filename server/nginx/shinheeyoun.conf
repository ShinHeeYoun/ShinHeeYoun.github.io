# Public front for the Tomcat status API on shinheeyoun.duckdns.org. Only /status/ and /scores/api/ reach Tomcat; every
# other path on this name is a 404, so the other applications on the same Tomcat are not exposed through it.
#
# This is the file as first written, listening on port 80 only. `certbot --nginx` then edited it on the
# server: it added the 443 ssl listener and certificate lines to this server block and created a second
# server block on port 80 that redirects to https. See ../HTTPS.md.
limit_req_zone $binary_remote_addr zone=status_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=scores_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name shinheeyoun.duckdns.org;
    server_tokens off;

    location /status/ {
        limit_req zone=status_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/status/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Yacht Dice scores (server/scores). Only /scores/api/ is passed on; bodies are limited to 16 KB.
    location /scores/api/ {
        limit_req zone=scores_api burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8080/scores/api/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
